:root{--bg:#120f1f;--card:#1e1a32;--card2:#2b2644;--gold:#ffc23d;--txt:#f6f1e7;--mut:#a59fb8;--ok:#3ee08f;--bad:#ff4f64;--line:#3a3458;--pc:#ffc23d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% -10%,#3a2470 0%,var(--bg) 55%) fixed;color:var(--txt);font-family:Cairo,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
#app{max-width:560px;margin:0 auto;padding:16px 14px 60px}
.logo{text-align:center;margin:18px 0 6px}

.orbit .core{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px;filter:drop-shadow(0 4px 18px #ffc23d55)}
.orbit .core img{width:76px;height:76px;border-radius:18px}
.orbit .ring{position:absolute;inset:0;animation:spin 14s linear infinite}
.orbit .ring span{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;display:flex;align-items:center;justify-content:center;font-size:24px;
  transform:rotate(var(--a)) translateY(-56px) rotate(calc(-1 * var(--a)))}
.orbit .ring span i{font-style:normal;display:block;animation:spin 14s linear infinite reverse}
h1{font-size:40px;font-weight:900;text-align:center;background:linear-gradient(180deg,#fff3c4,var(--gold) 60%,#e08a00);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 4px 30px #ffc23d33}
h2{font-size:21px;font-weight:800;margin-bottom:6px}
.brandsub{text-align:center;font-size:18px;font-weight:800;color:var(--txt);margin-top:-4px;letter-spacing:.5px}
.sub{text-align:center;color:var(--mut);margin:2px 0 26px;font-size:15px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font:800 17px Cairo,sans-serif;cursor:pointer;margin:10px 0;background:var(--card2);color:var(--txt);box-shadow:0 4px 0 #0006;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0006}
.btn.pri{background:linear-gradient(180deg,#ffd466,#ffb200);color:#2a1c00;box-shadow:0 4px 0 #a86f00}
.btn.bad{background:linear-gradient(180deg,#ff6b7d,#e8324a);color:#fff;box-shadow:0 4px 0 #8f1626}
.btn.hint{background:linear-gradient(180deg,#8f7bff,#6a52ff);color:#fff;box-shadow:0 4px 0 #3b2bb0}
.btn.hint small{opacity:.8;font-size:12px}
.hints{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.hchip{background:#6a52ff33;border:1px solid #8f7bff;color:#e6e0ff;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700}
.hchip small{color:#b9adff;font-size:11px}
.adbox{height:170px;border-radius:14px;background:repeating-linear-gradient(45deg,#2b2644,#2b2644 14px,#25203b 14px,#25203b 28px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin:10px 0}
.adbox .cd{font-size:48px;font-weight:900;color:var(--gold)}
.btn.ghost{background:transparent;box-shadow:none;border:1px solid var(--line)}
.btn.sm{display:inline-block;width:auto;padding:10px 14px;font-size:15px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0e0b19;color:var(--txt);font:600 16px Cairo,sans-serif}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:99px;background:var(--card2);border:1px solid var(--line);cursor:pointer;font:700 14px Cairo,sans-serif;color:var(--txt)}
.chip.on{background:var(--gold);color:#241a00;border-color:var(--gold)}
.langbar{display:flex;justify-content:center;margin-top:6px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-left:46px;min-height:40px;font-size:14px;color:var(--mut);gap:6px}
.top b{color:var(--gold);font-size:18px}
.link{background:none;border:0;color:var(--mut);font:700 14px Cairo,sans-serif;cursor:pointer}
#mute{position:fixed;top:10px;left:10px;z-index:20;background:var(--card2);border:1px solid var(--line);border-radius:99px;width:40px;height:40px;font-size:18px;cursor:pointer}
[dir=ltr] #mute{left:auto;right:10px}
[dir=ltr] .top{padding-left:0;padding-right:46px}
.board{background:var(--card);border:2px solid var(--line);border-inline-start:6px solid var(--pc);border-radius:18px;padding:12px;margin:10px 0;transition:.25s;scroll-margin-top:10px}
.board.turn{border-color:var(--pc);box-shadow:0 0 0 4px color-mix(in srgb,var(--pc) 25%,transparent),0 10px 30px #0006;transform:scale(1.01)}
.board.done{opacity:.85}
.board.won{border-color:var(--ok)}
.bhead{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:6px;font-size:16px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pc);margin-inline-end:6px}
.title{display:flex;flex-wrap:wrap;gap:8px 4px;justify-content:center;align-items:center;margin:8px 0 12px}
.word{display:flex;gap:3px;align-items:center}
.slot{width:28px;height:38px;border-radius:7px 7px 3px 3px;background:#ffffff0d;border-bottom:3px solid var(--mut);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
.mini .slot{width:23px;height:32px;font-size:18px}
.slot.show{border-color:var(--gold);color:var(--gold);background:#ffc23d1a}
.slot.new{animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
.slot.fix{border-color:transparent;background:none;color:var(--mut)}
.slot.rev{color:var(--bad);border-color:var(--bad)}
.board.won .slot.show,.board.won .slot.rev{color:var(--ok);border-color:var(--ok);background:#3ee08f1a}
.sep{color:var(--gold);font-size:26px;font-weight:900;padding:0 3px}
.wrongbox{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.w{aspect-ratio:1;border:1px dashed var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--bad);font-size:15px}
.w.f{border:1px solid var(--bad);background:#ff4f6426}
.w.new{animation:pop .35s}
.pen{font-size:12px;color:var(--bad);font-weight:800;text-align:center;margin-top:6px}
.kb{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:12px}
.kb.en{grid-template-columns:repeat(7,1fr)}

.k.ok{background:var(--ok);color:#06281a}
.k.no{background:#3a2030;color:#7a5566}
.actions{display:flex;gap:8px;margin-top:12px}

.badge{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--card2);font-weight:800}
.badge.ok{background:var(--ok);color:#06281a}.badge.bad{background:var(--bad);color:#fff}
.lvtag{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--card2);font-weight:800;color:var(--txt)}
.dock{position:sticky;bottom:8px;border:2px solid var(--pc);box-shadow:0 -10px 40px #000a}
.dock.wait .kb,.dock.wait .actions{opacity:.45;pointer-events:none}

.buzzbar .chips{margin-top:8px;justify-content:center}
.chip.bz{background:var(--pc);color:#1a1200;border-color:var(--pc);font-size:15px;padding:10px 14px}
.turnName{font-size:20px;font-weight:900;color:var(--pc)}
.tbar{height:8px;border-radius:99px;background:#ffffff14;overflow:hidden;margin:8px 0 2px}
.tbar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width 1s linear,background .3s}
.tbar.warn i{background:var(--bad)}
.tnum{font-weight:900;font-size:15px;min-width:34px;text-align:center}
.tnum.warn{color:var(--bad);animation:pulse .5s infinite alternate}
.mtime{float:left;font-weight:900;font-size:15px;color:var(--ok)}
[dir=ltr] .mtime{float:right}
.mtime.warn{color:var(--bad);animation:pulse .5s infinite alternate}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:start}
th{color:var(--mut);font-weight:600;font-size:13px}
.score{font-weight:900;color:var(--gold)}
.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:16px;z-index:30;animation:fade .15s}
.modal .card{width:100%;max-width:440px;animation:pop .25s}
.big{font-size:60px;text-align:center}
.center{text-align:center}
.mut{color:var(--mut);font-size:14px;line-height:1.9}
ul.rules{padding-inline-start:18px;line-height:2.1;font-size:15px}
ul.rules b{color:var(--gold)}
.banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:25}
.banner div{background:var(--pc);color:#1a1200;font-size:30px;font-weight:900;padding:14px 34px;border-radius:20px;box-shadow:0 10px 40px #000a;animation:ban 1s forwards}

@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{to{transform:scale(1.25)}}
.shake{animation:sh .4s}
@keyframes sh{20%{transform:translateX(9px)}40%{transform:translateX(-9px)}60%{transform:translateX(6px)}80%{transform:translateX(-4px)}}
.flashbad{animation:fb .5s}
@keyframes fb{0%{background:#ff4f6455}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--gold);padding:10px 20px;border-radius:99px;font-weight:800;z-index:40;white-space:nowrap;animation:fade .2s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:35}

// اختيار اسم عشوائي من مستوى معيّن. لو المستوى خلص بياخد من أقرب مستوى ليه.
function pickTitle(cat, lv, used){
  const all = CATS[cat].items;
  let free = all.filter(x => !used.has(x.t)); if (!free.length) free = all;
  const best = Math.min(...free.map(x => Math.abs(x.lv - lv)));
  const pool = free.filter(x => Math.abs(x.lv - lv) === best);
  return pool[Math.floor(Math.random() * pool.length)].t;
}

function tone(f, d, type = 'sine', vol = .18, delay = 0, f2 = null){
  const c = ac(); if (!c || MUTED) return;
  const tt = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, tt); if (f2) o.frequency.exponentialRampToValueAtTime(f2, tt + d);
  g.gain.setValueAtTime(0.0001, tt); g.gain.exponentialRampToValueAtTime(vol, tt + .01); g.gain.exponentialRampToValueAtTime(0.0001, tt + d);
  o.connect(g); g.connect(c.destination); o.start(tt); o.stop(tt + d + .05);
}
function noise(d, vol = .2, delay = 0){
  const c = ac(); if (!c || MUTED) return;
  const tt = c.currentTime + delay, buf = c.createBuffer(1, c.sampleRate * d, c.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const s = c.createBufferSource(), g = c.createGain(); s.buffer = buf; g.gain.value = vol; s.connect(g); g.connect(c.destination); s.start(tt);
}

const fx = document.getElementById('fx'), cx = fx.getContext('2d'); let parts = [], fxOn = false;
function confetti(n = 140){
  fx.width = innerWidth; fx.height = innerHeight;
  for (let i = 0; i < n; i++) parts.push({x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 4, s: 5 + Math.random() * 6, c: COLORS[i % 4], r: Math.random() * 6, life: 110 + Math.random() * 40});
  if (!fxOn) { fxOn = true; requestAnimationFrame(fxLoop); }
}
function fxLoop(){
  cx.clearRect(0, 0, fx.width, fx.height);
  parts = parts.filter(p => p.life-- > 0);
  for (const p of parts) { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += .2; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore(); }
  if (parts.length) requestAnimationFrame(fxLoop); else { fxOn = false; cx.clearRect(0, 0, fx.width, fx.height); }
}

// ---------- board logic ----------
// "و" العطف بتتكتب كلمة لوحدها بين سلاشين: "الإرهاب والكباب" ← الإرهاب / و / الكباب
// قاعدة تلقائية: أي كلمة بتبدأ بـ "وال" (و + ال) بنفصل منها الواو، إلا الكلمات اللي الواو فيها من أصل الكلمة (والد، والي…).
// لو الواو جاية مع كلمة من غير "ال" (زي "وليلة") بنكتبها مفصولة في المحتوى نفسه: "ألف ليلة و ليلة".
const WAW_KEEP = /^(والد|والده|والدة|والدي|والدين|والدتي|والدها|والدك|والي|واليا)$/;

function newBoard(title, owner){
  title = splitWaw(strip(title));
  const keys = new Set();
  for (const c of title) if (isLetter(c)) keys.add(norm(c));
  return {title, owner, keys, used: new Set(), fresh: null, wrong: [], solvePen: 0, hints: 0, hint: HINTS[flatKey(title)] || null, status: 'play', ar: isAr(title)};
}
const penalty = b => (b.status === 'lost' ? -MAXW : -b.wrong.length) - b.solvePen;
function guess(b, k){
  if (b.status !== 'play' || b.used.has(k)) return null;
  b.used.add(k); b.fresh = k;
  if (b.keys.has(k)) { if ([...b.keys].every(x => b.used.has(x))) b.status = 'won'; return true; }
  b.wrong.push(k);
  if (b.wrong.length >= MAXW) b.status = 'lost';
  return false;
}
const flat = s => [...strip(s)].filter(isLetter).map(norm).map(c => c === 'ة' ? 'ه' : c).join('');
function trySolve(b, txt){
  b.fresh = null;
  if (flat(txt).length && flat(txt) === flat(b.title)) { b.status = 'won'; b.keys.forEach(k => b.used.add(k)); return true; }
  b.solvePen += 10;
  return false;
}
function boardHTML(b){
  const fin = b.status !== 'play';
  let h = `<div class="title" dir="${b.ar ? 'rtl' : 'ltr'}">`;

    h += '<div class="word">' + (i ? '<span class="sep">/</span>' : '');
    for (const c of w) {
      if (!isLetter(c)) h += `<div class="slot fix">${esc(c)}</div>`;
      else if (b.used.has(norm(c))) h += `<div class="slot show ${b.fresh === norm(c) ? 'new' : ''}">${esc(c)}</div>`;
      else if (fin) h += `<div class="slot rev">${esc(c)}</div>`;
      else h += '<div class="slot"></div>';
    }
    h += '</div>';
  });
  h += '</div><div class="wrongbox">';
  for (let i = 0; i < MAXW; i++) { const x = b.wrong[i]; h += `<div class="w ${x ? 'f' : ''} ${x && i === b.wrong.length - 1 && b.fresh === x ? 'new' : ''}">${x ? esc(x) : ''}</div>`; }
  h += '</div>';

const AD_SECONDS = 5;
// ================= المنصة: فيسبوك أو متصفح عادي =================
// جوه فيسبوك (FBInstant موجود): بنشغّل الـ SDK والإعلانات الحقيقية.

const AD_PLACEMENT_ID = ''; // ← رقم مكان الإعلان (Rewarded Video) من Monetization Manager
const PF = {
  fb: false, preloaded: null,
  async init(){
    if (!window.FBInstant) return;
    try {
      await FBInstant.initializeAsync(); this.fb = true;
      let saved = null; try { saved = localStorage.getItem('gtn_lang'); } catch(e){}
      if (!saved) { LANG = String(FBInstant.getLocale() || '').startsWith('ar') ? 'ar' : 'en'; applyLang(); }
      FBInstant.setLoadingProgress(100);
      await FBInstant.startGameAsync();
      this.preload();
    } catch(e){ console.warn('FBInstant init failed', e); this.fb = false; }
  },
  playerId(){ try { return this.fb ? FBInstant.player.getID() : 'local'; } catch(e){ return 'local'; } },
  // تحميل الإعلان بدري عشان يبقى جاهز أول ما اللاعب يطلب تلميح
  preload(){
    if (!this.fb || !AD_PLACEMENT_ID) return;
    this.preloaded = FBInstant.getRewardedVideoAsync(AD_PLACEMENT_ID).then(ad => ad.loadAsync().then(() => ad)).catch(() => null);
  },
  // إعلان بمكافأة: done(true) بس لو الإعلان اتفرج عليه للآخر
  rewardedAd(done){
    if (this.fb && AD_PLACEMENT_ID) {
      const p = this.preloaded || Promise.resolve(null); this.preloaded = null;
      p.then(ad => ad ? ad.showAsync().then(() => done(true)) : done(false)).catch(() => done(false)).finally(() => this.preload());
      return;
    }
    let left = AD_SECONDS;
    modal(`<h2>${t('adTitle')}</h2><div class="adbox"><div>${t('ad')}</div><div class="cd" id="adcd">${left}</div><div class="mut">${t('adNote')}</div></div><p class="mut center">${t('adWait')}</p>`);
    const iv = setInterval(() => {
      left--; const el = document.getElementById('adcd'); if (el) el.textContent = left;
      if (left <= 0) { clearInterval(iv); closeModal(); done(true); }
    }, 1000);
  }
};

// بعد أي حركة: الشاشة بتفضل على نفس اللاعب ثانيتين عشان الكل يشوف الحرف نزل فين، وبعدين الدور يعدّي
const SHOW_MS = 2000;
// الجرس 🔔: بعد أي حرف، أي لاعب عرف الاسم يدوس على اسمه. أسرع واحد ياخد الإجابة
// (صاحب الاسم = يقول اسمه، غيره = ريسك). الجرس مش بياخد دور حد.
const BUZZ_SEC = 3, BUZZ_ANSWER = 20;
function clearNT(){ clearInterval(S.nt); clearTimeout(S.nt); S.nt = null; }
function nextTurn(msg, delay = SHOW_MS, buzzIdx = null){
  stopTimer(); clearNT(); S.busy = true; S.buzz = null;
  renderMulti(); toast(msg);
  const go = () => {
    clearNT(); if (S.mode !== 'multi' || !S.boards) return;
    S.buzz = null;
    if (!S.boards.some(b => b.status === 'play')) return endRound();
    const len = S.boards.length;
    for (let j = 1; j <= len; j++) { const idx = (S.turn + j) % len; if (eligible(idx)) { S.turn = idx; break; } }
    beginTurn();
  };
  // الأول: ثانيتين الكل يشوف الحرف نزل فين. بعدها (لو الاسم لسه مفتوح): شريط الجرس 3 ثواني مكان الكيبورد
  const openBuzz = () => {
    S.buzz = buzzIdx; S.bleft = BUZZ_SEC; renderMulti(); sfx('tick');
    S.nt = setInterval(() => {
      S.bleft--; const e = document.getElementById('bzl'); if (e) e.textContent = S.bleft;
      if (S.bleft <= 0) go();
    }, 1000);
  };
  const canBuzz = buzzIdx !== null && S.boards[buzzIdx].status === 'play';
  S.nt = setTimeout(canBuzz ? openBuzz : go, delay);
}
function buzzHTML(){
  if (S.buzz === null || S.buzz === undefined) return '';
  const tp = S.players[S.boards[S.buzz].owner];
  const btns = S.boards.map(b => b.owner).map(p => `<button class="chip bz" style="--pc:${S.players[p].color}" onclick="buzz(${p})">🔔 ${esc(S.players[p].name)}</button>`).join('');
  return `<div class="buzzbar"><div>${t('buzzQ', `<b style="color:${tp.color}">${esc(tp.name)}</b>`)} <b class="tnum" id="bzl">${S.bleft}</b></div><div class="chips">${btns}</div></div>`;
}
function buzz(p){
  if (S.buzz === null || S.buzz === undefined) return;
  clearNT(); const idx = S.buzz; S.buzz = null; S.bz = {p, idx};
  const b = S.boards[idx], own = b.owner === p, pl = S.players[p];
  sfx('risk'); renderMulti();
  let left = BUZZ_ANSWER;
  modal(`<div class="mtime">⏱ <b id="bzt">${left}</b> ${t('sec')}</div><h2>🔔 <span style="color:${pl.color}">${esc(pl.name)}</span> ${own ? t('buzzOwn') : t('buzzRisk', esc(S.players[b.owner].name))}</h2>
    <p class="mut">${own ? t('buzzOwnNote') : t('buzzRiskNote')}<br>${t('buzzMust')}</p>
    <input id="mi" dir="${b.ar ? 'rtl' : 'ltr'}" placeholder="${t('typeName')}" onkeydown="if(event.key==='Enter')doBuzz()">
    <div class="actions"><button class="btn pri" onclick="doBuzz()">${t('confirm')}</button></div>`);
  S.bt = setInterval(() => {
    left--; const e = document.getElementById('bzt'); if (e) { e.textContent = left; e.parentElement.classList.toggle('warn', left <= 5); }
    if (left > 0 && left <= 5) sfx('tick');
    if (left <= 0) doBuzz(true);
  }, 1000);
}
function doBuzz(timeout){
  const el = document.getElementById('mi'); if (!S.bz || !el) return;
  const v = el.value; if (!timeout && !flat(v)) return;
  clearInterval(S.bt); closeModal();
  const {p, idx} = S.bz; S.bz = null;
  const b = S.boards[idx], who = S.players[p].name;
  let ok;
  if (b.owner === p) { if (timeout) { b.solvePen += 10; ok = false; } else ok = trySolve(b, v); }
  else { ok = !timeout && flat(v) === flat(b.title); statRisk(p, ok); if (ok) { S.delta[p] += 5; b.status = 'stolen'; b.fresh = null; } else S.delta[p] -= 10; }
  if (ok) { sfx(b.owner === p ? 'win' : 'riskOk'); confetti(); } else sfx('riskBad');
  nextTurn(ok ? t('buzzOk', who, b.owner === p) : t('buzzBad', who));
  if (!ok) shake();
}
function scoreTable(withDelta){
  const rows = S.players.map((p, i) => {
    const inRound = S.guessers.includes(i);
    const d = i === S.setter ? '🔒 0' : !inRound ? '—' : (withDelta ? (S.delta[i] > 0 ? '+' : '') + S.delta[i] : '');
    return `<tr><td><span class="dot" style="--pc:${p.color}"></span>${esc(p.name)}</td>${withDelta ? `<td>${d}</td>` : ''}<td class="score">${p.score}</td></tr>`;
  }).join('');
  return `<div class="card"><table><tr><th>${t('player')}</th>${withDelta ? `<th>${t('thisRound')}</th>` : ''}<th>${t('total')}</th></tr>${rows}</table></div>`;
}
function endRound(){
  stopTimer();
  document.documentElement.style.setProperty('--pc', '#ffc23d');
  S.boards.forEach(b => {
    S.delta[b.owner] += penalty(b); b.fresh = null;
    const pen = penalty(b), won = b.status === 'won';
    updateProfile(S.players[b.owner].prof, p => { p.titles++; p.sumPen += pen; if (won) { p.solved++; if (pen === 0) p.perfect++; } });
  });
  S.players.forEach((p, i) => { if (S.guessers.includes(i)) p.score += S.delta[i]; });
  const last = S.tb || S.round === S.rounds - 1;
  sfx('win');
  const reveal = S.boards.map(b => `<div class="board mini done ${b.status === 'won' ? 'won' : ''}" style="--pc:${S.players[b.owner].color}"><div class="bhead"><span><span class="dot"></span>${esc(S.players[b.owner].name)}</span>${statusBadge(b)}</div>${boardHTML(b)}</div>`).join('');
  app.innerHTML = `<div class="top"><span></span><span>${S.tb ? t('endTb') : t('endOf', rLabel())}</span><span></span></div>
    ${reveal}${scoreTable(true)}
    <button class="btn pri" onclick="sfx('tap');${last ? 'finalResults()' : 'S.round++;roundSetup()'}">${last ? t('finalRes') : !S.auto && (S.round + 1) % S.players.length === 0 ? t('nextMatch') : t('nextRound')}</button>`;
}
function finalResults(){
  const max = Math.max(...S.players.map(p => p.score));
  const tied = S.players.map((p, i) => i).filter(i => S.players[i].score === max);
  if (tied.length > 1 && !S.acceptTie) {
    sfx('risk');
    app.innerHTML = `<div class="card center" style="margin-top:40px"><div class="big">⚔️</div><h2>${t('tie')}</h2>
      <p class="mut">${t('tiedOn', tied.map(i => `<b style="color:${S.players[i].color}">${esc(S.players[i].name)}</b>`).join(t('and')), max)}</p>
      <button class="btn pri" onclick="startTiebreak()">${t('tbBtn')}</button>
      <button class="btn" onclick="S.acceptTie=true;finalResults()">${t('acceptTie')}</button></div>
      ${scoreTable(false)}`;
    S.tied = tied; return;
  }
  const ranked = S.players.slice().sort((a, b) => b.score - a.score);
  if (!S.statsDone) { S.statsDone = true; S.players.forEach((p, i) => updateProfile(p.prof, x => { x.games++; if (tied.length === 1 && tied[0] === i) x.wins++; })); }
  const medals = ['🏆', '🥈', '🥉', '🎬'];
  sfx('fanfare'); confetti(220); setTimeout(() => confetti(160), 700);
  const rows = ranked.map((p, i) => `<tr><td>${medals[i] || ''} <span class="dot" style="--pc:${p.color}"></span>${esc(p.name)}</td><td class="score">${p.score}</td></tr>`).join('');
  const winTitle = tied.length > 1 ? t('tiedWin', tied.map(i => esc(S.players[i].name)).join(t('and'))) : t('won', esc(ranked[0].name));
  app.innerHTML = `<div class="card center" style="margin-top:30px;border-color:${ranked[0].color}"><div class="big">🏆</div><h2 style="font-size:28px;color:${ranked[0].color}">${winTitle}</h2></div>
    <div class="card"><table>${rows}</table></div>
    <button class="btn pri" onclick="S.players.forEach(p=>p.score=0);S.round=0;S.tb=false;S.acceptTie=false;S.statsDone=false;S.usedTitles=new Set();roundSetup()">${t('newGame')}</button>
    <button class="btn" onclick="home()">${t('homeBtn')}</button>`;
}
function startTiebreak(){
  S.tb = true; S.setter = -1; S.guessers = S.tied.slice(); S.rlv = roundLevel();
  const titles = {}; S.guessers.forEach(i => { titles[i] = pickRandom(); });
  startRound(titles);
}

applyLang();
home();
PF.init().then(() => { if (PF.fb) home(); });
</script>
</body>
